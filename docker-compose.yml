# Production deployment. Images are published to GHCR by scripts/release.sh; nothing is built here.
# Configure through .env (copy .env.example). The "worker" profile runs on an n8n Docker host.
name: n8n-ops

services:
  server:
    image: ghcr.io/shlomiporush/n8n-ops:${N8N_OPS_VERSION:-latest}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_OPS_PORT:-8080}:8080"
    volumes:
      - ${N8N_OPS_DATA_DIR:-./data}/server:/data
    restart: unless-stopped

  postgres:
    image: postgres:18.6-bookworm
    env_file: .env
    volumes:
      - ${N8N_OPS_DATA_DIR:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    profiles: [worker]
    image: ghcr.io/shlomiporush/n8n-ops-worker:${N8N_OPS_VERSION:-latest}
    env_file: .env
    group_add:
      - "${DOCKER_SOCKET_GID:-docker}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${N8N_OPS_WORKER_DIR:-./worker-data}:/data
    restart: unless-stopped
