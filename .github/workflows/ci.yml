name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The Release workflow runs the whole CI on the commit it releases when it finds no green CI run of
  # that commit on main to reuse (scripts/ci-result.sh).
  workflow_call:
  schedule:
    # Weekly full sweep that ignores path filters.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  # Named after the running workflow, so a release's CI never waits behind, or replaces, the CI of main.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a pull request, which areas it changes, so the jobs that cannot be affected are skipped. The documentation
  # paths are those scripts/verify.sh treats as documentation. A file outside the known areas sets "other", which
  # runs every job.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      server: ${{ steps.filter.outputs.server }}
      worker: ${{ steps.filter.outputs.worker }}
      shared: ${{ steps.filter.outputs.shared }}
      skill: ${{ steps.filter.outputs.skill }}
      other: ${{ steps.filter.outputs.other }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # No token: the files come from a git diff between the pull request's base and the commit this run checks,
          # not from the API, whose list follows later pushes on a re-run and stops at 3000 files.
          token: ""
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!README.md'
              - '!AGENTS.md'
              - '!CHANGELOG.md'
              - '!LICENSE'
            server:
              - 'apps/server/**'
            worker:
              - 'apps/worker/**'
            shared:
              - 'packages/shared/**'
            skill:
              - 'packages/skill/**'
            other:
              - '**'
              - '!docs/**'
              - '!README.md'
              - '!AGENTS.md'
              - '!CHANGELOG.md'
              - '!LICENSE'
              - '!apps/web/**'
              - '!apps/server/**'
              - '!apps/worker/**'
              - '!packages/shared/**'
              - '!packages/skill/**'

  guards:
    name: Guards
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/verify.sh --guards-only

  # The parts of scripts/verify.sh side by side, each in a job of its own (--only): Checks, Integration, and the
  # end-to-end suite once per design. Together they run what a full sweep runs.
  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify changed areas
        if: github.event_name == 'pull_request'
        run: scripts/verify.sh --skip-guards --changed origin/main --only checks
      - name: Verify everything
        if: github.event_name != 'pull_request'
        run: scripts/verify.sh --skip-guards --only checks

  integration:
    # The stack, the database and the worker: a change to the web app or the skill alone cannot affect it, and the
    # end-to-end jobs build the same images.
    name: Integration
    needs: changes
    if: >-
      github.event_name != 'pull_request' || needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.worker == 'true' || needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.other == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify changed areas
        if: github.event_name == 'pull_request'
        run: scripts/verify.sh --skip-guards --changed origin/main --only integration
      - name: Verify everything
        if: github.event_name != 'pull_request'
        run: scripts/verify.sh --skip-guards --only integration

  e2e:
    # One job per design: each runs the whole end-to-end suite on its own stack.
    name: E2E (${{ matrix.design }})
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        design: [regular, compact]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify changed areas
        if: github.event_name == 'pull_request'
        run: scripts/verify.sh --skip-guards --changed origin/main --only e2e --design ${{ matrix.design }}
      - name: Verify everything
        if: github.event_name != 'pull_request'
        run: scripts/verify.sh --skip-guards --only e2e --design ${{ matrix.design }}

  skill:
    # The skill runs on the agent's computer: its three versions are checked where they run (Linux runs in Checks).
    name: Skill (${{ matrix.os }})
    needs: changes
    if: >-
      github.event_name != 'pull_request' || needs.changes.outputs.skill == 'true' ||
      needs.changes.outputs.other == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            impls: node,ps,pwsh
          - os: macos-latest
            impls: node,sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Contract tests
        working-directory: packages/skill
        env:
          N8N_OPS_IMPLS: ${{ matrix.impls }}
        run: node --test --test-concurrency=1 test/contract.test.mjs

  summary:
    name: CI summary
    if: always()
    needs: [changes, guards, checks, integration, e2e, skill]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A required job did not succeed"; exit 1 ;;
            esac
          done
