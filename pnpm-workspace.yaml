packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@hono/node-server@2.1.5'
  - '@aws-sdk/client-s3@3.1151.0'

# Packages allowed to run install scripts. esbuild verifies its platform binary. ssh2 (SFTP backups)
# would build optional native speedups; it works without them, in plain JavaScript.
allowBuilds:
  esbuild: true
  cpu-features: false
  ssh2: false
