# A disposable n8n in queue mode for scripts/verify.sh: a main and one queue worker on the official image, sharing a
# PostgreSQL database, Redis and the encryption key. The verification stack's worker finds the queue worker next to
# the main and checks it through the stack's socket proxy. Not secrets. Started and removed by scripts/verify.sh only.
x-n8n: &n8n
  image: n8nio/n8n:2.44.3
  environment:
    N8N_ENCRYPTION_KEY: verify-only-queue-key
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_DATABASE: n8n
    DB_POSTGRESDB_USER: n8n
    DB_POSTGRESDB_PASSWORD: verify-only-password
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    # Keep retrying while Redis is stopped on purpose, instead of exiting after the default ten seconds.
    QUEUE_BULL_REDIS_TIMEOUT_THRESHOLD: "600000"
    N8N_METRICS: "true"
    N8N_METRICS_INCLUDE_QUEUE_METRICS: "true"
    QUEUE_HEALTH_CHECK_ACTIVE: "true"
    N8N_RUNNERS_ENABLED: "false"

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: verify-only-password
      POSTGRES_DB: n8n
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.2.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  n8n:
    <<: *n8n
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5678/healthz/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 3s
      timeout: 5s
      retries: 60

  n8n-worker:
    <<: *n8n
    command: worker
    depends_on:
      n8n: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5678/healthz/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 3s
      timeout: 5s
      retries: 60

  # A socket proxy of its own for the checks of what it refuses, so the stack's proxy is never changed. It starts by
  # refusing commands everywhere; scripts/verify.sh recreates it with the lines n8n-ops computes (an override file).
  queue-proxy:
    image: wollomatic/socket-proxy:1.13.1
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - -listenip=0.0.0.0
      - -allowfrom=queue-probe
      - -allowhealthcheck
      - '-allowGET=(/v1\.[0-9]+)?/(_ping|exec/[0-9a-f]+/json|containers/json)'
      - '-allowPOST=(/v1\.[0-9]+)?/(containers/(none)/exec|exec/[0-9a-f]+/start)'
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # The worker image without its agent: only probe-cli runs in it, against queue-proxy. No server, no identity, so
  # the image's heartbeat check would never pass and is turned off.
  queue-probe:
    image: n8n-ops-worker:${N8N_OPS_IMAGE_TAG:-verify}
    user: node
    entrypoint: ["sleep", "infinity"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DOCKER_HOST: tcp://queue-proxy:2375
    healthcheck:
      disable: true
