# Development stack. Copy to the repository root as docker-compose-dev.yml (ignored by git)
# and use it only through scripts/local.sh. scripts/verify.sh uses this tracked file directly.
# Relative paths resolve against the repository root (the scripts pass --project-directory).
# Images are built by the scripts; nothing is built here.

services:
  server:
    image: n8n-ops-server:${N8N_OPS_IMAGE_TAG:-dev}
    env_file: docker/dev.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_OPS_PORT:-8080}:8080"
    volumes:
      - ${N8N_OPS_DATA_DIR:?N8N_OPS_DATA_DIR is set by the scripts}/server:/data

  postgres:
    image: postgres:18.6-bookworm
    env_file: docker/dev.env
    volumes:
      - ${N8N_OPS_DATA_DIR:?N8N_OPS_DATA_DIR is set by the scripts}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    image: n8n-ops-worker:${N8N_OPS_IMAGE_TAG:-dev}
    env_file: docker/dev.env
    depends_on:
      server:
        condition: service_healthy
    group_add:
      - "${DOCKER_SOCKET_GID:?DOCKER_SOCKET_GID is set by the scripts}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${N8N_OPS_DATA_DIR:?N8N_OPS_DATA_DIR is set by the scripts}/worker:/data
