name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The Release workflow runs the whole CI on the commit it releases.
  workflow_call:
  schedule:
    # Weekly full sweep that ignores path filters.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  # Named after the running workflow, so a release's CI never waits behind, or replaces, the CI of main.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'

  guards:
    name: Guards
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/verify.sh --guards-only

  verify:
    # One job per design, side by side: each runs the whole end-to-end suite on its own stack.
    name: Verify (${{ matrix.design }})
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        design: [regular, compact]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify changed areas
        if: github.event_name == 'pull_request'
        run: scripts/verify.sh --skip-guards --changed origin/main --design ${{ matrix.design }}
      - name: Verify everything
        if: github.event_name != 'pull_request'
        run: scripts/verify.sh --skip-guards --design ${{ matrix.design }}

  skill:
    # The skill runs on the agent's computer: its three versions are checked where they run (Linux runs in Verify).
    name: Skill (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            impls: node,ps
          - os: macos-latest
            impls: node,sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Contract tests
        working-directory: packages/skill
        env:
          N8N_OPS_IMPLS: ${{ matrix.impls }}
        run: node --test --test-concurrency=1 test/contract.test.mjs

  summary:
    name: CI summary
    if: always()
    needs: [changes, guards, verify, skill]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A required job did not succeed"; exit 1 ;;
            esac
          done
