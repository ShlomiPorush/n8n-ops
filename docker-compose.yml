# Production deployment. Runs the images scripts/release.sh publishes to GHCR; nothing is built here.
# Behind Traefik on the external "traefik" network, so no port is published. Configure through .env
# (copy .env.example); every variable is documented there.
#
# Persistent data lives in host directories next to this file:
#   ./data           the server's app key (losing it loses every stored secret)
#   ./postgres-data  the database
# "docker compose down" keeps both.
#
# Compose interpolation is limited to VERSION, DOMAIN and the PostgreSQL credentials. Everything the
# server reads comes through env_file.
#
# Hardening on every service: no new privileges, all Linux capabilities dropped (both get back only
# what they need while they start as root) and log rotation. The server also runs with a read-only
# root filesystem.
name: n8n-ops

services:
  server:
    image: ghcr.io/shlomiporush/n8n-ops:${VERSION:?Set VERSION in .env to the release to run}
    container_name: n8n-ops
    security_opt:
      - no-new-privileges:true
    # The image starts as root only to hand ./data to node, then runs the server as node with no
    # capability left: CHOWN for the owner, DAC_READ_SEARCH to walk a ./data kept private (0700),
    # SETUID and SETGID to switch to node.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
    # Writes nothing outside /data and /tmp at runtime.
    read_only: true
    tmpfs:
      - /tmp
    # No mem_limit: the nightly backup of the n8n-ops database holds the whole dump in memory, so a
    # fixed ceiling would stop the server once the database outgrows it.
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - traefik
      - n8n-ops
    volumes:
      - ./data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.n8n-ops.loadbalancer.server.port=8080"
      - "traefik.http.routers.n8n-ops.entrypoints=https"
      - "traefik.http.routers.n8n-ops.rule=Host(`${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.n8n-ops.tls=true"
      - "traefik.http.routers.n8n-ops.service=n8n-ops"
      - "traefik.http.routers.n8n-ops.middlewares=default@file"
    # Calls /healthz/ready, which includes the database; the same check as the image's, written out here.
    healthcheck:
      test: ["CMD", "as-node", "node", "dist/healthcheck.js"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-bookworm
    container_name: n8n-ops-postgres
    security_opt:
      - no-new-privileges:true
    # The official entrypoint starts as root, fixes the ownership of the data and socket directories,
    # then drops to the postgres user. These five capabilities are exactly what that needs.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1g
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # Only its own three values: the server's secrets in .env never reach this container.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 keeps its data in a versioned directory under /var/lib/postgresql.
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n-ops

networks:
  # The server and the database. Not internal: the server reaches n8n, Telegram, SMTP and storage.
  n8n-ops:
  traefik:
    external: true
